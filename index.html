<title>Mi Lectura</title>
<style>
:root{--bg:#efe4d0;--card:#fbf4e7;--ink:#30251d;--muted:#786a59;--green:#203d2e;--mint:#e5d7bd;--line:#d6c5a7;--coral:#b18a4b;--gold:#c4a15b;--shadow:0 8px 24px #30251d12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:88px}.top{padding:24px 20px 18px;background:linear-gradient(135deg,#14291f,#294735);color:#f5ead7;border-radius:0 0 26px 26px;border-bottom:2px solid #b99a5a}.toprow{display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:12px;opacity:.78;letter-spacing:.08em;text-transform:uppercase}.top h1{font-size:27px;margin:4px 0}.top p{margin:0;color:#d8ebe3;font-size:14px}.round{border:1px solid #ffffff50;background:#ffffff18;color:white;border-radius:50%;width:42px;height:42px;font-size:24px}.content{padding:18px 16px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:4px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px}.sectionhead h2{font-size:18px;margin:0}.sub{font-size:13px;color:var(--muted)}.primary{background:var(--green);color:#f7edda;border:1px solid #b99a5a;border-radius:13px;padding:12px 16px;font-weight:650}.secondary{background:#e8dbc2;color:var(--green);border:1px solid #d0b987;border-radius:12px;padding:10px 12px;font-weight:650}.danger{background:#fff0ea;color:#a4472c;border:0;border-radius:10px;padding:8px 10px}.book{display:flex;gap:13px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}.cover{width:66px;min-width:66px;min-height:92px;border-radius:9px;background:linear-gradient(145deg,#1d3829,#8c7047);display:flex;align-items:center;justify-content:center;color:white;font-size:25px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.bookmain{min-width:0;flex:1}.booktitle{font-weight:750;line-height:1.25}.rating-stars{display:flex;gap:2px;color:#b58a32;letter-spacing:1px;font-size:18px;line-height:1.2;margin-top:5px}.rating-stars .empty-star{color:#d8c9ad}.rating-label{font-size:11px;color:var(--muted);margin-left:5px;letter-spacing:0}.rating-select{display:flex;gap:6px;align-items:center}.rating-select button{border:0;background:transparent;padding:2px;color:#d8c9ad;font-size:29px;line-height:1}.rating-select button.selected{color:#b58a32;text-shadow:0 1px #e4cf91}.rating-select button:focus-visible{outline:2px solid var(--gold);border-radius:6px}.author{color:var(--muted);font-size:13px;margin-top:3px}.pill{display:inline-block;font-size:11px;border-radius:99px;padding:3px 8px;background:var(--mint);color:var(--green);margin-top:7px}.progressline{height:7px;background:#e2d5bd;border-radius:20px;overflow:hidden;margin:9px 0 5px}.progressline div{height:100%;background:#b18a4b;border-radius:20px}.bookfoot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#20382cf2;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px max(8px,env(safe-area-inset-bottom));z-index:5}.tabwrap{display:flex;width:min(760px,100%);justify-content:space-around}.tab{border:0;background:transparent;color:#d8c8a9;padding:7px 12px;border-radius:12px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}.tab b{font-size:20px;font-weight:500}.tab.active{color:#f4e4c4;background:#3b5843;font-weight:700;border:1px solid #b99a5a}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:3px;margin-bottom:12px}.filter{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 12px;color:var(--muted);font-size:13px}.filter.active{background:var(--green);color:white;border-color:var(--green)}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid #d9e0d8;background:#fff8ec;border-radius:11px;padding:12px;color:var(--ink);outline-color:var(--green)}.field textarea{min-height:76px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .field{min-width:0}.modal{position:fixed;inset:0;background:#102a24a8;z-index:10;display:none;align-items:flex-end;justify-content:center;padding:0}.modal.open{display:flex}.sheet{width:min(760px,100%);max-height:92dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px max(24px,env(safe-area-inset-bottom))}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheethead h2{margin:0;font-size:21px}.close{border:0;background:#e5d7bd;border-radius:50%;width:36px;height:36px;font-size:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1}.empty{text-align:center;padding:28px 16px;color:var(--muted)}.empty .emoji{font-size:38px}.chart{display:flex;align-items:end;gap:8px;height:150px;padding:14px 4px 0;border-bottom:1px solid var(--line)}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:6px;min-width:0}.bar{width:min(28px,75%);min-height:3px;background:#b18a4b;border-radius:7px 7px 2px 2px}.barlabel{font-size:10px;color:var(--muted)}.historyitem{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}.historyitem:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;background:#b18a4b;margin-top:6px;flex-shrink:0}.historyitem strong{font-size:14px}.historyitem p{margin:3px 0 0;color:var(--muted);font-size:13px}.hint{font-size:12px;color:var(--muted);margin:10px 0}.toast{position:fixed;left:16px;right:16px;bottom:90px;background:#20382c;color:#f5ead7;border:1px solid #b99a5a;border-radius:12px;padding:13px 16px;z-index:20;display:none;max-width:500px;margin:auto}.toast.show{display:block}.search{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:11px 13px;margin-bottom:12px}.goalrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.smallbtn{border:1px solid var(--line);background:white;border-radius:9px;padding:7px 9px;font-size:12px;color:var(--muted)}@media(min-width:600px){.content{padding:22px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.sheet{border-radius:24px;margin:20px}.modal{align-items:center;padding:20px}.top{margin-top:14px;border-radius:26px}}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;text-transform:capitalize}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:12px;color:var(--muted);padding:5px}.calday{min-height:48px;border:1px solid var(--line);border-radius:10px;padding:5px;text-align:center;background:#fff8eb;font-size:13px}.calday.read{background:#e0d1b3;border-color:#b99a5a;color:#20382c;font-weight:bold}.calday.today{outline:2px solid #20382c;outline-offset:-2px}.calday small{display:block;font-size:9px;color:#6c5432;margin-top:3px}.calday.blank{background:transparent;border-color:transparent}.callegend{display:flex;align-items:center;gap:7px;margin-top:14px;font-size:12px}.golddot{width:9px;height:9px;border-radius:50%;background:#b18a4b;display:inline-block} .sectionhead h2{font-family:Georgia,"Times New Roman",serif;letter-spacing:.01em}.top h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.01em}.card,.stat,.book{box-shadow:0 5px 18px #30251d0b} .eyebrow{letter-spacing:.15em;color:#d7bd83}</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div><div class="eyebrow">Tu rincón de lectura</div><h1>Mi Lectura 📚</h1><p id="todayline">Unas páginas cada día cuentan.</p></div><button class="round" id="quickAdd" aria-label="Añadir libro">＋</button></div></header>
<main class="content" id="view"></main>
<nav class="tabs"><div class="tabwrap">
<button class="tab active" data-tab="inicio"><b>⌂</b>Inicio</button>
<button class="tab" data-tab="biblioteca"><b>▤</b>Biblioteca</button>
<button class="tab" data-tab="calendario"><b>▦</b>Calendario</button>
<button class="tab" data-tab="estadisticas"><b>▥</b>Estadísticas</button>
<button class="tab" data-tab="historial"><b>◷</b>Historial</button>
</div></nav>
</div>
<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><h2 id="modalTitle">Añadir libro</h2><button class="close" id="closeModal" aria-label="Cerrar">×</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='miLectura.v1';
let data=load(),tab='inicio',filter='Todos',search='';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{books:[],sessions:[],goal:24}}catch(e){return{books:[],sessions:[],goal:24}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(s){if(!s)return '';return new Date(s+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}
function fmtLong(s){return new Date(s+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}
function status(b){return b.current>=b.total?'Terminado':b.current>0?'Leyendo':'Pendiente'}
function pct(b){return b.total?Math.min(100,Math.round(b.current/b.total*100)):0}
function totalPages(){return data.sessions.reduce((n,s)=>n+s.pages,0)}
function finished(){return data.books.filter(b=>b.total>0&&b.current>=b.total).length}
function active(){return data.books.filter(b=>b.current>0&&b.current<b.total)}
function stat(label,val,sub=''){return `<div class="stat"><span>${label}</span><strong>${val}</strong>${sub?`<span>${sub}</span>`:''}</div>`}
function bookHTML(b){let p=pct(b),st=status(b),rating=Math.max(0,Math.min(5,Number(b.rating)||0));return `<article class="book"><div class="cover">${b.cover?`<img src="${esc(b.cover)}" alt="">`:'📖'}</div><div class="bookmain"><div class="booktitle">${esc(b.title)}</div><div class="author">${esc(b.author||'Autor desconocido')}</div>${rating?`<div class="rating-stars" aria-label="Valoración: ${rating} de 5 estrellas">${'★'.repeat(rating)}<span class="empty-star">${'☆'.repeat(5-rating)}</span><span class="rating-label">${rating}/5</span></div>`:''}<span class="pill">${st}</span><div class="progressline"><div style="width:${p}%"></div></div><div class="bookfoot"><span>${b.current} / ${b.total} páginas · cap. ${esc(b.chapter||'—')}${b.totalChapters?' / '+b.totalChapters+' capítulos':''}</span><strong>${p}%</strong></div><div class="actions"><button class="secondary" onclick="openProgress('${b.id}')">${st==='Terminado'?'Ver libro':'Actualizar'}</button><button class="smallbtn" onclick="editBook('${b.id}')">Editar</button></div></div></article>`}
function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));let v=document.getElementById('view');if(tab==='inicio')v.innerHTML=home();if(tab==='biblioteca')v.innerHTML=library();if(tab==='estadisticas')v.innerHTML=stats();if(tab==='calendario')v.innerHTML=calendarView();if(tab==='historial')v.innerHTML=history();document.getElementById('todayline').textContent=fmtLong(today())+' · Cada página cuenta.'}
function home(){let recent=[...data.books].filter(b=>b.current>0&&b.current<b.total).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));return `<div class="stats">${stat('Libros terminados',finished())}${stat('Páginas registradas',totalPages())}${stat('En curso',active().length)}${stat('Libros en biblioteca',data.books.length)}</div><div class="sectionhead"><h2>Seguir leyendo</h2><button class="secondary" onclick="openBook()">＋ Añadir</button></div>${recent.length?recent.slice(0,3).map(bookHTML).join(''):`<div class="card empty"><div class="emoji">🌿</div><strong>Tu próxima aventura empieza aquí</strong><p>Añade un libro y registra tu primera sesión de lectura.</p><button class="primary" onclick="openBook()">Añadir mi primer libro</button></div>`}<div class="sectionhead"><h2>Resumen de esta semana</h2><span class="sub">Páginas leídas</span></div><div class="card">${weekChart()}<p class="hint">Las páginas se calculan a partir de las sesiones que registres.</p></div><div class="sectionhead"><h2>Accesos rápidos</h2></div><div class="card goalrow"><div><strong>🎯 Objetivo anual</strong><div class="sub">${finished()} de ${data.goal} libros terminados</div><div class="progressline"><div style="width:${Math.min(100,finished()/Math.max(1,data.goal)*100)}%"></div></div></div><button class="smallbtn" onclick="setGoal()">Cambiar</button></div>`}
function library(){let list=data.books.filter(b=>(filter==='Todos'||status(b)===filter)&&(`${b.title} ${b.author}`.toLowerCase().includes(search.toLowerCase())));return `<div class="sectionhead" style="margin-top:4px"><h2>Mi biblioteca</h2><button class="primary" onclick="openBook()">＋ Nuevo libro</button></div><input class="search" placeholder="Buscar por título o autor…" value="${esc(search)}" oninput="search=this.value;render()"><div class="filters">${['Todos','Leyendo','Pendiente','Terminado'].map(f=>`<button class="filter ${filter===f?'active':''}" onclick="filter='${f}';render()">${f}${f==='Todos'?' ('+data.books.length+')':''}</button>`).join('')}</div>${list.length?list.map(bookHTML).join(''):`<div class="card empty"><div class="emoji">📚</div><strong>No hay libros en esta vista</strong><p>Añade un libro o cambia el filtro.</p></div>`}`}
function weekChart(){let days=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');days.push({key,label:d.toLocaleDateString('es-ES',{weekday:'short'}).slice(0,2),n:data.sessions.filter(s=>s.date===key).reduce((a,s)=>a+s.pages,0)})}let max=Math.max(1,...days.map(x=>x.n));return `<div class="chart">${days.map(d=>`<div class="barcol" title="${d.n} páginas"><div class="bar" style="height:${Math.max(3,d.n/max*100)}%"></div><span class="barlabel">${d.label}</span></div>`).join('')}</div><div style="text-align:center;margin-top:12px;font-weight:750">${days.reduce((a,d)=>a+d.n,0)} páginas en los últimos 7 días</div>`}
function stats(){let month=today().slice(0,7),monthPages=data.sessions.filter(s=>s.date.startsWith(month)).reduce((a,s)=>a+s.pages,0),avg=Math.round(totalPages()/Math.max(1,new Set(data.sessions.map(s=>s.date)).size));let byBook={};data.sessions.forEach(s=>byBook[s.bookTitle]=(byBook[s.bookTitle]||0)+s.pages);let top=Object.entries(byBook).sort((a,b)=>b[1]-a[1]).slice(0,5);return `<div class="sectionhead" style="margin-top:4px"><h2>Tus estadísticas</h2></div><div class="stats">${stat('Páginas totales',totalPages())}${stat('Este mes',monthPages)}${stat('Libros terminados',finished())}${stat('Media por día',avg,'en días con lectura')}</div><div class="sectionhead"><h2>Lectura de los últimos 7 días</h2></div><div class="card">${weekChart()}</div><div class="sectionhead"><h2>Progreso de tu biblioteca</h2></div><div class="card">${data.books.length?data.books.map(b=>`<div style="margin:12px 0"><div class="goalrow"><strong>${esc(b.title)}</strong><span class="sub">${pct(b)}%</span></div><div class="progressline"><div style="width:${pct(b)}%"></div></div><div class="sub">${b.current} de ${b.total} páginas</div></div>`).join(''):'Aún no hay libros para mostrar.'}</div><div class="sectionhead"><h2>Libros con más páginas registradas</h2></div><div class="card">${top.length?top.map(([name,n])=>`<div class="goalrow" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(name)}</span><strong>${n} pág.</strong></div>`).join(''):'Registra sesiones para descubrir tus libros más leídos.'}</div><div class="sectionhead"><h2>Objetivo anual</h2><button class="smallbtn" onclick="setGoal()">Editar objetivo</button></div><div class="card"><div class="goalrow"><div><strong style="font-size:25px">${finished()} / ${data.goal}</strong><div class="sub">libros terminados</div></div><span style="font-size:28px">🎯</span></div><div class="progressline"><div style="width:${Math.min(100,finished()/Math.max(1,data.goal)*100)}%"></div></div></div>`}
let calDate=new Date();
function calendarView(){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;let counts={};data.sessions.forEach(s=>{counts[s.date]=(counts[s.date]||0)+s.pages});let cells='';for(let i=0;i<offset;i++)cells+='<div class="calday blank"></div>';for(let d=1;d<=days;d++){let key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),n=counts[key]||0;cells+=`<div class="calday ${n?'read':''} ${key===today()?'today':''}"><span>${d}</span>${n?`<small>${n}</small>`:''}</div>`}let daysRead=Object.keys(counts).filter(k=>k.startsWith(y+'-'+String(m+1).padStart(2,'0'))).length;return `<div class="sectionhead" style="margin-top:4px"><h2>Calendario de lectura</h2></div><div class="card"><div class="calhead"><button class="smallbtn" onclick="moveMonth(-1)">‹</button><strong>${new Date(y,m,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</strong><button class="smallbtn" onclick="moveMonth(1)">›</button></div><div class="calendar">${['L','M','X','J','V','S','D'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div><div class="callegend"><span class="golddot"></span> Día con lectura <span class="sub">· ${daysRead} días este mes</span></div></div><div class="sectionhead"><h2>Resumen del mes</h2></div><div class="stats">${stat('Páginas',Object.entries(counts).filter(([k])=>k.startsWith(y+'-'+String(m+1).padStart(2,'0'))).reduce((a,[k,v])=>a+v,0))}${stat('Días de lectura',daysRead)}${stat('Sesiones',data.sessions.filter(s=>s.date.startsWith(y+'-'+String(m+1).padStart(2,'0'))).length)}${stat('Minutos',data.sessions.filter(s=>s.date.startsWith(y+'-'+String(m+1).padStart(2,'0'))).reduce((a,s)=>a+(s.minutes||0),0))}</div><p class="hint">Los días se marcan automáticamente cuando guardas una sesión de lectura.</p>`}
function moveMonth(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);render()}
function history(){let sessions=[...data.sessions].sort((a,b)=>(b.date+b.created).localeCompare(a.date+a.created));return `<div class="sectionhead" style="margin-top:4px"><h2>Historial de lectura</h2></div><p class="sub">Cada sesión que guardes aparecerá aquí.</p><div class="card">${sessions.length?sessions.map(s=>`<div class="historyitem"><div class="dot"></div><div><strong>${esc(s.bookTitle)}</strong><p>${fmtDate(s.date)} · ${s.pages} páginas${s.from!=null?` (pág. ${s.from}–${s.to})`:''}${s.chapter?` · Cap. ${esc(s.chapter)}`:''}</p>${s.minutes?`<p>${s.minutes} min de lectura</p>`:''}${s.note?`<p>${esc(s.note)}</p>`:''}</div></div>`).join(''):`<div class="empty"><div class="emoji">📝</div><strong>Tu historial aparecerá aquí</strong><p>Actualiza un libro para registrar tu primera sesión.</p></div>`}</div><div class="sectionhead"><h2>Datos y privacidad</h2></div><div class="card"><p class="sub">Tus datos se guardan en el almacenamiento local de este navegador. No se envían a ningún servidor. Si borras los datos del navegador, podrías perderlos.</p><div class="actions"><button class="secondary" onclick="exportData()">Exportar copia de seguridad</button><button class="smallbtn" onclick="document.getElementById('importFile').click()">Importar copia</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></div></div>`}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function openBook(b=null){let edit=b;openModal(edit?'Editar libro':'Añadir libro',`<form id="bookForm"><div class="field"><label>Título *</label><input name="title" required maxlength="160" value="${esc(edit?.title||'')}" placeholder="Nombre del libro"></div><div class="field"><label>Autor</label><input name="author" maxlength="120" value="${esc(edit?.author||'')}" placeholder="Nombre del autor"></div><div class="formgrid"><div class="field"><label>Páginas totales *</label><input name="total" type="number" min="1" required value="${edit?.total||''}" placeholder="320"></div><div class="field"><label>Página actual</label><input name="current" type="number" min="0" value="${edit?.current||0}"></div></div><div class="formgrid"><div class="field"><label>Capítulos totales</label><input name="totalChapters" type="number" min="0" value="${edit?.totalChapters||''}" placeholder="Ej. 24"></div><div class="field"><label>Capítulo actual</label><input name="chapter" maxlength="80" value="${esc(edit?.chapter||'')}" placeholder="Ej. 8 o El viaje"></div></div><div class="formgrid"><div class="field"><label>Estado</label><select name="state"><option value="auto">Automático</option><option value="Pendiente" ${edit&&status(edit)==='Pendiente'?'selected':''}>Pendiente</option><option value="Leyendo" ${edit&&status(edit)==='Leyendo'?'selected':''}>Leyendo</option><option value="Terminado" ${edit&&status(edit)==='Terminado'?'selected':''}>Terminado</option></select></div><div class="field"><label>Valoración del libro</label><select name="rating"><option value="0" ${!edit||!edit.rating?'selected':''}>Sin valorar</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${edit&&Number(edit.rating)===n?'selected':''}>${'★'.repeat(n)}${'☆'.repeat(5-n)} · ${n}/5</option>`).join('')}</select></div></div><div class="field"><label>URL de portada (opcional)</label><input name="cover" type="url" value="${esc(edit?.cover||'')}" placeholder="https://…"></div><p class="hint">Al guardar un cambio de página, podrás crear una sesión en el historial.</p><div class="actions"><button class="primary" type="submit">Guardar libro</button>${edit?`<button class="danger" type="button" onclick="deleteBook('${edit.id}')">Eliminar</button>`:''}</div></form>`);
document.getElementById('bookForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),total=+f.get('total'),current=Math.min(total,Math.max(0,+f.get('current')||0));if(!total||total<1)return toast('Introduce el total de páginas.');let bdata={id:edit?.id||crypto.randomUUID(),title:f.get('title').trim(),author:f.get('author').trim(),total,current,totalChapters:Math.max(0,+f.get('totalChapters')||0),chapter:f.get('chapter').trim(),cover:f.get('cover').trim(),rating:Math.max(0,Math.min(5,+f.get('rating')||0)),updated:today()};if(edit){let old=edit.current;Object.assign(edit,bdata);if(current>old)addSession(edit,old,current,0,'','Actualización de progreso');}else{data.books.push(bdata);if(current>0)addSession(bdata,0,current,0,'','Progreso inicial');}save();closeModal();render();toast('Libro guardado');};}
function editBook(id){let b=data.books.find(x=>x.id===id);if(b)openBook(b)}
function deleteBook(id){let b=data.books.find(x=>x.id===id);if(!b||!confirm(`¿Eliminar «${b.title}» y sus sesiones del historial?`))return;data.books=data.books.filter(x=>x.id!==id);data.sessions=data.sessions.filter(s=>s.bookId!==id);save();closeModal();render();toast('Libro eliminado')}
function openProgress(id){let b=data.books.find(x=>x.id===id);if(!b)return;openModal('Actualizar lectura',`<div class="card" style="margin:14px 0"><strong>${esc(b.title)}</strong><div class="sub">${b.current} de ${b.total} páginas · ${pct(b)}%</div><div class="progressline"><div style="width:${pct(b)}%"></div></div></div><form id="progressForm"><div class="formgrid"><div class="field"><label>Página actual</label><input name="current" type="number" min="0" max="${b.total}" value="${b.current}" required></div><div class="field"><label>Capítulo</label><input name="chapter" value="${esc(b.chapter||'')}" placeholder="Capítulo 12"></div></div><div class="formgrid"><div class="field"><label>Fecha de lectura</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Minutos (opcional)</label><input name="minutes" type="number" min="0" placeholder="25"></div></div><div class="field"><label>Nota (opcional)</label><textarea name="note" placeholder="¿Qué tal ha ido la lectura?"></textarea></div><div class="actions"><button class="primary" type="submit">Guardar progreso</button><button class="secondary" type="button" onclick="editBook('${id}')">Editar libro</button></div></form>`);
document.getElementById('progressForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),cur=Math.min(b.total,Math.max(0,+f.get('current'))),date=f.get('date'),mins=+f.get('minutes')||0,note=f.get('note').trim(),old=b.current;if(cur<old&&!confirm('La página es menor que tu progreso actual. ¿Quieres guardar el cambio igualmente?'))return;b.current=cur;b.chapter=f.get('chapter').trim();b.updated=date;if(cur!==old||mins||note){let pages=Math.max(0,cur-old);addSession(b,old,cur,mins,note,'',date,pages);if(cur<old) data.sessions.push({id:crypto.randomUUID(),bookId:b.id,bookTitle:b.title,date, pages:0,from:old,to:cur,minutes:0,note:'Corrección de progreso',created:Date.now()})}save();closeModal();render();toast('Progreso actualizado');};}
function addSession(b,from,to,minutes=0,note='',label='',date=today(),pages=Math.max(0,to-from)){data.sessions.push({id:crypto.randomUUID(),bookId:b.id,bookTitle:b.title,date,pages,from,to,chapter:b.chapter||'',minutes,note:note||label,created:Date.now()})}
function setGoal(){openModal('Objetivo anual',`<form id="goalForm"><div class="field"><label>¿Cuántos libros quieres terminar este año?</label><input name="goal" type="number" min="1" max="500" value="${data.goal}" required></div><button class="primary" type="submit">Guardar objetivo</button></form>`);document.getElementById('goalForm').onsubmit=e=>{e.preventDefault();data.goal=Math.max(1,+new FormData(e.target).get('goal'));save();closeModal();render();toast('Objetivo actualizado')}}
function exportData(){let blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mi-lectura-copia-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('Copia de seguridad exportada')}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.books)||!Array.isArray(x.sessions))throw Error();if(!confirm('Importar esta copia reemplazará los datos actuales. ¿Continuar?'))return;data={books:x.books,sessions:x.sessions,goal:x.goal||24};save();render();toast('Copia importada')}catch(err){toast('El archivo no parece una copia válida')}e.target.value=''};r.readAsText(file)}
let toastTimer;function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;render()});
document.getElementById('quickAdd').onclick=()=>openBook();document.getElementById('closeModal').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
render();
// Registra el service worker para uso sin conexión. Requiere HTTPS o localhost.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('No se pudo registrar el modo sin conexión:', err));
  });
}
</script>
</body>
</html>
